<script>
// ==========================================
// 設定定数
// ==========================================
// true  : 問題をランダムに抽出する（シャッフルする）
// false : JSONに記述された順番のまま出題する
const RANDOM_QUESTIONS = false; 
// ==========================================

let allQuestions = []; // JSONから読み込んだ全問題
let questions = [];    // 今回出題する問題
let currentIdx = 0;
let userAnswers = [];

// 外部のJSONファイル（questions.json）から問題を読み込む
async function loadQuestions() {
try {
const response = await fetch('questions.json');
if (!response.ok) throw new Error('Network response was not ok');
allQuestions = await response.json();

if (allQuestions.length === 0) {
throw new Error('問題データが空です');
}

startQuiz();
} catch (error) {
document.getElementById('question-text').innerText = "問題データの読み込みに失敗しました。\n(※ローカル環境で開く場合は簡易サーバー等をご利用ください)";
document.getElementById('progress-info').innerText = "エラー";
console.error(error);
}
}

// クイズを開始
function startQuiz() {
const selectCount = Math.min(12, allQuestions.length);

if (RANDOM_QUESTIONS) {
const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
questions = shuffled.slice(0, selectCount);
} else {
questions = allQuestions.slice(0, selectCount);
}

currentIdx = 0;
userAnswers = new Array(questions.length).fill(null);
renderQuestion();
}

// 共通：正解データを必ず配列の形（例: [1] や [1, 5]）に正規化するヘルパー関数
function getCorrectArray(correct) {
return Array.isArray(correct) ? correct : [correct];
}

// ユーザーの回答が正解と一致しているかを判定する関数
function checkIsCorrect(userAns, correctDef) {
if (userAns === null || userAns === undefined) return false;
const correctArr = getCorrectArray(correctDef);

if (Array.isArray(userAns)) {
if (userAns.length !== correctArr.length) return false;
return userAns.every(val => correctArr.includes(val)) && correctArr.every(val => userAns.includes(val));
} else {
return correctArr.length === 1 && correctArr[0] === userAns;
}
}

function renderQuestion() {
if (questions.length === 0) return;
const q = questions[currentIdx];
document.getElementById('progress-info').innerText = `問題 ${currentIdx + 1} / ${questions.length}`;
document.getElementById('question-tag').innerText = q.tag;
document.getElementById('question-text').innerText = q.question;

const container = document.getElementById('options-container');
container.innerHTML = '';

const correctArr = getCorrectArray(q.correct);
const isMultiple = correctArr.length > 1; // 正解が複数の場合はtrue

q.options.forEach((opt, idx) => {
const userAns = userAnswers[currentIdx];
let isChecked = false;
if (Array.isArray(userAns)) {
isChecked = userAns.includes(idx);
} else {
isChecked = userAns === idx;
}

const div = document.createElement('label');
div.className = `flex items-start p-3 border rounded-xl cursor-pointer transition ${isChecked ? 'border-indigo-600 bg-indigo-50/50' : 'border-slate-200 hover:bg-slate-50'}`;

if (isMultiple) {
// 正解が複数の場合はチェックボックス（複数選択）
div.innerHTML = `
<input type="checkbox" name="option" value="${idx}" ${isChecked ? 'checked' : ''} onchange="toggleOption(${idx})" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
<span class="ml-3 text-sm text-slate-700 leading-snug whitespace-pre-wrap">${opt}</span>
`;
} else {
// 正解が1つの場合はラジオボタン（単一選択）
div.innerHTML = `
<input type="radio" name="option" value="${idx}" ${isChecked ? 'checked' : ''} onclick="selectOption(${idx})" class="mt-1 h-4 w-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
<span class="ml-3 text-sm text-slate-700 leading-snug whitespace-pre-wrap">${opt}</span>
`;
}
container.appendChild(div);
});

document.getElementById('prev-btn').disabled = currentIdx === 0;
const nextBtn = document.getElementById('next-btn');
if (currentIdx === questions.length - 1) {
nextBtn.innerText = "結果を確認する";
nextBtn.onclick = submitQuiz;
} else {
nextBtn.innerText = "次へ";
nextBtn.onclick = nextQuestion;
}
}

// 単一選択（ラジオボタン）用の処理
function selectOption(idx) {
userAnswers[currentIdx] = idx;
renderQuestion();
}

// 複数選択（チェックボックス）用の処理
function toggleOption(idx) {
let currentVal = userAnswers[currentIdx];

if (!Array.isArray(currentVal)) {
currentVal = currentVal !== null && currentVal !== undefined ? [currentVal] : [];
}

const pos = currentVal.indexOf(idx);
if (pos > -1) {
currentVal.splice(pos, 1); // 選択解除
} else {
currentVal.push(idx); // 追加
}

userAnswers[currentIdx] = currentVal.length > 0 ? currentVal : null;
renderQuestion();
}

function nextQuestion() {
if (currentIdx < questions.length - 1) {
currentIdx++;
renderQuestion();
}
}

function prevQuestion() {
if (currentIdx > 0) {
currentIdx--;
renderQuestion();
}
}

function submitQuiz() {
if (userAnswers.includes(null)) {
if (!confirm("未回答の問題がありますが、結果を確認しますか？")) {
return;
}
}

let score = 0;
questions.forEach((q, idx) => {
if (checkIsCorrect(userAnswers[idx], q.correct)) {
score++;
}
});

document.getElementById('quiz-screen').classList.add('hidden');
document.getElementById('footer-nav').classList.add('hidden');
document.getElementById('result-screen').classList.remove('hidden');

document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
const percentage = Math.round((score / questions.length) * 100);
document.getElementById('pass-fail-text').innerText = percentage >= 60
? `正答率: ${percentage}% - 合格ライン（60%）クリアです！おめでとうございます！`
: `正答率: ${percentage}% - 合格ライン（60%）までもう少しです！復習して再挑戦しましょう。`;

// 詳細な解説・解答一覧の構築
const reviewContainer = document.getElementById('review-container');
reviewContainer.innerHTML = '';

questions.forEach((q, idx) => {
const userAns = userAnswers[idx];
const isCorrect = checkIsCorrect(userAns, q.correct);
const correctArr = getCorrectArray(q.correct);

const card = document.createElement('div');
card.className = `p-4 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'}`;

let optionsHtml = '';
q.options.forEach((opt, optIdx) => {
const isOptCorrect = correctArr.includes(optIdx);
const isUserOpt = Array.isArray(userAns) ? userAns.includes(optIdx) : userAns === optIdx;

let badge = '';
if (isOptCorrect) badge += '<span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded ml-2">正解</span>';
if (isUserOpt && !isCorrect) badge += '<span class="text-xs bg-rose-600 text-white px-2 py-0.5 rounded ml-2">あなたの回答</span>';

optionsHtml += `<li class="text-xs py-1 leading-relaxed ${isOptCorrect ? 'font-bold text-emerald-800' : 'text-slate-600'}">- ${opt} ${badge}</li>`;
});

card.innerHTML = `
<div class="flex items-center justify-between mb-2">
<span class="text-xs font-bold text-slate-500">問 ${idx + 1}</span>
<span class="text-xs font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">${isCorrect ? '正解' : '不正解'}</span>
</div>
<p class="text-sm font-semibold text-slate-800 mb-2 whitespace-pre-wrap">${q.question}</p>
<ul class="mb-3 space-y-1">${optionsHtml}</ul>
<div class="text-xs text-slate-600 bg-white p-2.5 rounded-lg border border-slate-100 leading-relaxed">
<span class="font-bold text-slate-700">解説:</span> ${q.explanation}
</div>
`;
reviewContainer.appendChild(card);
});
}

function restartQuiz() {
startQuiz();
document.getElementById('result-screen').classList.add('hidden');
document.getElementById('quiz-screen').classList.remove('hidden');
document.getElementById('footer-nav').classList.remove('hidden');
window.scrollTo({ top: 0, behavior: 'smooth' });
}

// アプリ起動時にデータ読み込みを実行
loadQuestions();
</script>
